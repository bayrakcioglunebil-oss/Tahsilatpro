name: Build TahsilatPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o TahsilatPro_APK_Hazir-1.zip -d extracted
          find extracted -maxdepth 3 -type f | head -50

      - name: Find Android project
        run: |
          echo "Android project:"
          find extracted -name "settings.gradle.kts" -o -name "settings.gradle"

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -1)")
          cd "$PROJECT"
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TahsilatPro-APK
          path: "extracted/**/app/build/outputs/apk/debug/*.apk"
